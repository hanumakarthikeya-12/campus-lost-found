<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Report an item</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="/">Campus<span>Find</span></a><nav id="nav"></nav></header><main class="narrow wide"><section class="panel"><p class="eyebrow">MAKE A REPORT</p><h1>Report lost or found item</h1><form id="report-form" class="stack">
<label>Report type<select name="type" required><option value="lost">I lost an item</option><option value="found">I found an item</option></select></label>
<label>Item name<input name="title" maxlength="100" required></label><label>Category<select name="category" required><option value="">Select category</option><option>Electronics</option><option>Accessories</option><option>Bags</option><option>Books</option><option>ID Card</option><option>Bottle</option><option>Keys</option><option>Clothing</option><option>Other</option></select></label>
<label>Description<textarea name="description" maxlength="1000" rows="4" required></textarea></label><label>Campus location<input name="location" placeholder="e.g. Library, Block A" required></label><label>Date<input type="date" name="date" required></label><label>Image (optional)<input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="btn">Submit report</button></form><p id="message" class="message"></p></section></main><script src="app.js"></script></body></html>
